name: Update Pac-Man Contribution Graph

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Generate Pac-Man contribution SVGs
        uses: abozanona/pacman-contribution-graph@v3.2.5
        with:
          github_user_name: ${{ github.repository_owner }}
          games: pacman
          player_style: opportunistic
          hide_month_labels: "false"

      - name: Publish SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
